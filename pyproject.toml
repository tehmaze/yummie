[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "yummie"
version = "0.2.1"
description = "Automated yum upgrades"
license = "MIT"
keywords = ["yum", "rpm", "update", "upgrade"]
requires-python = ">=3.6"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[[project.authors]]
name = "Wijnand Modderman-Lenstra"
email = "maze@pyth0n.org"

[project.urls]
Homepage = "https://github.com/tehmaze/yummie"
Repository = "https://github.com/tehmaze/yummie.git"
Issues = "https://github.com/tehmaze/yummie/issues"

[project.optional-dependencies]
dev = ["ruff>=0.16.4", "pylint>=4.0", "pycodestyle>=2.14", "pre-commit>=4.6"]

[tool.setuptools]
script-files = ["yummie"]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-include = ["yummie"]

[tool.ruff.lint]
extend-select = [
]
ignore = [
    "B006",    # mutable-argument-default
    "E722",    # pycodestyle - bare-except
    "LOG015",  # root-logger-call
    "PLR1704", # redefined-argument-from-local
    "SIM115",  # open-file-with-context-handler
]

[tool.pylint.basic]
module-naming-style = "any"

[tool.pylint.format]
max-line-length = 88

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
